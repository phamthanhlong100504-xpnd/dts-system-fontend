# Production compose for dts-frontend (Next.js standalone).
# Deployed by .github/workflows/deploy.yml: GHCR image is pushed by CI, pulled here.
# Backend URLs bake vào image LÚC BUILD qua --build-arg (xem next.config.ts + Dockerfile).
services:
  dts-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-phamthanhlong100504-xpnd}/dts-frontend:latest
    container_name: dts-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    mem_limit: 512m
    # Không env API URLs (đã bake qua --build-arg lúc build) và không dts-network
    # (backend ở VPS 103.75.182.249, không cùng docker network trên hoangcn.com).
