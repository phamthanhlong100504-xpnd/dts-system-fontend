name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dts-frontend
  DEPLOY_DIR: /dts/dts-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker build \
            --build-arg GATEWAY_API_URL=http://103.20.96.56:8888 \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Prepare docker-compose payload
        id: compose
        run: |
          echo "B64=$(base64 -w 0 docker-compose.prod.yml)" >> $GITHUB_OUTPUT

      - uses: appleboy/ssh-action@v1.2.2
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: COMPOSE_B64
          timeout: 30m
          script: |
            set -euo pipefail
            docker network create dts-network || true
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            df -h
            docker builder prune -a -f || true
            docker image prune -a -f
            docker compose pull
            docker compose up -d
            # Xác nhận container thật sự đang chạy — bắt fail ngầm
            docker compose ps -a | grep -q Up || { echo "ERROR: dts-frontend not running"; exit 1; }
